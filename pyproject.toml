[project]
name = "personal-vector-db"
version = "0.1.0"
description = "Local-first personal vector database retrieval core"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "qdrant-client>=1.15,<2",
  "sentence-transformers>=5.1,<6",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "jsonschema>=4.23,<5",
  "pypdf>=5,<6",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "pyyaml>=6.0,<7",
]

[project.scripts]
vdb = "personal_vector_db.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires an externally running service"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
