name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Run unit, contract, and local integration tests
        run: uv run pytest -q

      - name: Run lint
        run: uv run ruff check .

      - name: Validate lockfile
        run: uv lock --check

      - name: Validate Compose configuration
        run: docker compose config --quiet

  qdrant-server:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Start Qdrant server
        run: docker compose up -d qdrant

      - name: Wait for Qdrant readiness
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:6333/readyz; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color qdrant
          exit 1

      - name: Run Qdrant server integration tests
        env:
          VDB_QDRANT_URL: http://localhost:6333
        run: uv run pytest -q tests/test_qdrant_server_integration.py

      - name: Stop Qdrant server
        if: always()
        run: docker compose down
